{% extends 'vamos/base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow border-0">
        <div class="card-header bg-warning text-dark">
            <h4 class="mb-0 fw-bold"><i class="bi bi-database-up me-2"></i>Atualizar Base de Frotas</h4>
        </div>
        <div class="card-body p-4">
            <div class="alert alert-info">
                <i class="bi bi-info-circle-fill me-2"></i>
                Ao enviar uma nova planilha, a <strong>base antiga será substituída inteiramente</strong>.
                <br>Certifique-se de que a planilha contenha as colunas: <strong>PLACA, CLIENTE, MODELO, CHASSI...</strong>
            </div>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label fw-bold">Arquivo Excel (.xlsx) ou CSV</label>
                    {{ form.arquivo }}
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning fw-bold px-4">
                        <i class="bi bi-upload me-2"></i> Importar Agora
                    </button>
                    <a href="{% url 'sinistros_home' %}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Adiciona classe bootstrap no input de arquivo
    document.querySelector('input[type="file"]').classList.add('form-control');
</script>
{% endblock %}
