{% extends 'vamos/base.html' %}
{% block content %}

<style>
    /* Define fixed height for chart cards on large screens */
    .card-chart {
        height: 420px;
        min-height: 260px;
        max-height: 720px;
        padding: 0.75rem;
        overflow: hidden; 
        position: relative; /* Necessary for Chart.js with maintainAspectRatio: false */
    }

    /* Ensures canvas fills the available space in the card */
    .card-chart canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
    }

    /* Adjustment for smaller screens (Tablets/Mobile) */
    @media (max-width: 992px) {
        .card-chart {
            height: 300px;
            min-height: 220px;
        }
    }
</style>

<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Dashboard - Gestão de Sinistros</h4>
    <div>
      <select id="filter_segmento" class="form-select form-select-sm">
        <option value="">Todos Segmentos</option>
        <option value="PESADOS">Pesados</option>
        <option value="AGRO">Agro</option>
        <option value="INTRA">Intra</option>
      </select>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-md-3">
      <div class="card p-3">
        <div class="small text-muted">Total Pago</div>
        <div id="card_total_pago" class="fs-4 fw-bold">R$ 0,00</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card p-3">
        <div class="small text-muted">Total A Pagar</div>
        <div id="card_total_a_pagar" class="fs-4 fw-bold">R$ 0,00</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card p-3">
        <div class="small text-muted">Total Pendente</div>
        <div id="card_total_pendente" class="fs-4 fw-bold">R$ 0,00</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card p-3">
        <div class="small text-muted">Tempo Médio SLA</div>
        <div id="card_avg_sla" class="fs-4 fw-bold">0d 0h</div>
      </div>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-lg-8">
      
      <div class="card p-3 mb-3 card-chart">
        <h6 class="fw-bold small text-muted">Sinistros em Andamento por Setor</h6>
        <div style="position: relative; height: 100%; width: 100%;">
            <canvas id="chart_by_sector"></canvas>
        </div>
      </div>

      <div class="card p-3 mb-3 card-chart">
        <h6 class="fw-bold small text-muted">Maiores Ofensores (Média de Dias)</h6>
        <div style="position: relative; height: 100%; width: 100%;">
            <canvas id="chart_offenders_avg"></canvas>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card p-3 mb-3 card-chart">
        <h6 class="fw-bold small text-muted">Finalizados vs Abertos</h6>
        <div style="position: relative; height: 85%; width: 100%;">
            <canvas id="chart_finalizados"></canvas>
        </div>
        <div class="mt-auto text-center pt-2">
          <a id="export_csv" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-file-earmark-spreadsheet me-1"></i> Export CSV (staff)
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const API_URL = "{% url 'dashboard_stats_api' %}";
const EXPORT_URL = "{% url 'dashboard_export_csv' %}";

function moneyBR(v){
  return Number(v||0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

// Common options for bar charts
const barOptions = {
  responsive: true,
  maintainAspectRatio: false, // Important: uses CSS .card-chart to control height
  plugins: {
    legend: { position: 'top' }
  },
  scales: {
    x: {
      grid: { display: false },
      ticks: { 
          autoSkip: true, 
          maxTicksLimit: 10, // Limits label count to avoid overlap
          maxRotation: 0, 
          minRotation: 0 
      }
    },
    y: {
      beginAtZero: true,
      ticks: { precision: 0 } // Show only integers
    }
  }
};

let sectorChart = null;
let offendersAvgChart = null;
let finalizadosChart = null;

function updateCharts(data) {
  // --- Update KPIs (Top Cards) ---
  document.getElementById('card_total_pago').innerText = moneyBR(data.total_pago);
  document.getElementById('card_total_a_pagar').innerText = moneyBR(data.total_a_pagar);
  document.getElementById('card_total_pendente').innerText = moneyBR(data.total_pendente);
  document.getElementById('card_avg_sla').innerText = data.avg_sla_display;

  // --- Chart 1: Sectors (Bar) ---
  const labels = data.counts_by_sector.map(s => s.setor_label);
  const values = data.counts_by_sector.map(s => s.count);
  
  if (!sectorChart) {
    const ctx = document.getElementById('chart_by_sector').getContext('2d');
    sectorChart = new Chart(ctx, {
      type: 'bar',
      data: { 
          labels: labels, 
          datasets: [{ 
              label: 'Andamento', 
              data: values, 
              backgroundColor: '#0d6efd',
              maxBarThickness: 100, // Limits max bar width
              barPercentage: 0.6,
              categoryPercentage: 0.7
          }]
      },
      options: barOptions
    });
  } else {
    sectorChart.data.labels = labels;
    sectorChart.data.datasets[0].data = values;
    sectorChart.update();
  }

  // --- Chart 2: Offenders (Bar) ---
  const labels2 = data.offenders_avg.map(o => o.setor_label);
  const vals2 = data.offenders_avg.map(o => o.avg_days);
  
  if (!offendersAvgChart) {
    const ctx2 = document.getElementById('chart_offenders_avg').getContext('2d');
    offendersAvgChart = new Chart(ctx2, {
      type: 'bar',
      data: { 
          labels: labels2, 
          datasets: [{ 
              label: 'Média dias', 
              data: vals2, 
              backgroundColor: '#dc3545',
              maxBarThickness: 80, // Slightly thinner bars here
              barPercentage: 0.6,
              categoryPercentage: 0.7
          }]
      },
      options: barOptions
    });
  } else {
    offendersAvgChart.data.labels = labels2;
    offendersAvgChart.data.datasets[0].data = vals2;
    offendersAvgChart.update();
  }

  // --- Chart 3: Finalized (Doughnut) ---
  const finalizados = data.finalizados_total || 0;
  const openCount = data.counts_by_sector.reduce((sum, s) => sum + s.count, 0) - finalizados;
  // Ensure non-negative (safety)
  const safeOpenCount = Math.max(0, openCount);
  
  if (!finalizadosChart) {
    const ctx3 = document.getElementById('chart_finalizados').getContext('2d');
    finalizadosChart = new Chart(ctx3, {
      type: 'doughnut',
      data: { 
          labels: ['Abertos', 'Finalizados'], 
          datasets: [{ 
              data: [safeOpenCount, finalizados], 
              backgroundColor: ['#0d6efd', '#198754'] 
          }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false, // Uses parent container size
        plugins: { legend: { position: 'top' } }
      }
    });
  } else {
    finalizadosChart.data.datasets[0].data = [safeOpenCount, finalizados];
    finalizadosChart.update();
  }
}

function fetchAndUpdate(){
  const segmento = document.getElementById('filter_segmento').value;
  const url = new URL(API_URL, window.location.origin);
  if (segmento) url.searchParams.set('segmento', segmento);
  
  fetch(url.toString())
    .then(r => r.json())
    .then(data => {
      updateCharts(data);
    })
    .catch(err => console.error('Erro dashboard:', err));
}

// Event Listeners
document.getElementById('filter_segmento').addEventListener('change', fetchAndUpdate);
document.getElementById('export_csv').addEventListener('click', function(e){
  const segmento = document.getElementById('filter_segmento').value;
  const url = new URL(EXPORT_URL, window.location.origin);
  if (segmento) url.searchParams.set('segmento', segmento);
  window.location = url.toString();
});

// Initialization
fetchAndUpdate();
// Auto-refresh every 30s
setInterval(fetchAndUpdate, 30000);
</script>
{% endblock %}
