{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Gestão de Frotas - Login">
    <title>Login - Vamos Frotas SLA</title>
    
    <!-- Bootstrap Icons for input icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Login CSS -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    
    <!-- Favicon -->
    <link rel="icon" href="{% static 'img/logo.png' %}">
</head>
<body>
    <!-- Background with truck image and dark gradient overlay -->
    <div class="login-background"></div>
    
    <div class="login-container" role="main">
        <!-- Centered glassmorphism login card -->
        <div class="login-card" role="region" aria-label="Formulário de Login">
            <!-- Logo -->
            <img src="{% static 'img/logo.png' %}" alt="Logo Vamos Frotas" class="login-logo">
            
            <!-- Enhanced typography hierarchy -->
            <h2 class="login-title">Bem-vindo à Vamos</h2>
            <p class="login-subtitle">Insira suas credenciais para acessar o sistema</p>
            
            <!-- Alert messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}" role="alert" aria-live="polite">
                        <i class="bi bi-exclamation-circle"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
            
            <!-- Login form -->
            <form method="post" action="{% url 'login' %}" aria-label="Formulário de autenticação">
                {% csrf_token %}
                
                <!-- Username field with icon -->
                <div class="form-group">
                    <i class="bi bi-person input-icon" aria-hidden="true"></i>
                    <input 
                        type="text" 
                        name="username" 
                        id="id_username"
                        class="form-control-modern" 
                        placeholder="Usuário" 
                        required 
                        autofocus
                        autocomplete="username"
                        aria-required="true"
                        aria-label="Campo de usuário"
                    >
                </div>

                <!-- Password field with icon -->
                <div class="form-group">
                    <i class="bi bi-lock input-icon" aria-hidden="true"></i>
                    <input 
                        type="password" 
                        name="password" 
                        id="id_password"
                        class="form-control-modern" 
                        placeholder="Senha" 
                        required
                        autocomplete="current-password"
                        aria-required="true"
                        aria-label="Campo de senha"
                    >
                </div>

                <!-- Full-width submit button -->
                <button type="submit" class="btn-login" aria-label="Entrar no sistema">
                    ENTRAR
                </button>
            </form>

            <!-- Footer links -->
            <div class="login-footer">
                <a href="{% url 'reset_password' %}" aria-label="Recuperar senha esquecida">Esqueceu a senha?</a>
                <a href="{% url 'signup' %}" aria-label="Criar nova conta">Criar conta</a>
            </div>
        </div>
    </div>
    
    <!-- Footer signature -->
    <div class="footer-signature">Created by Lucas Sureira</div>
</body>
</html>
