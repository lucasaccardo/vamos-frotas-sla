{% extends 'vamos/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
<div class="login-container">
    <!-- Centered glassmorphism login card -->
    <div class="login-card">
        <!-- Logo -->
        <img src="{% static 'img/logo.png' %}" alt="Logo Vamos" class="login-logo">

        <!-- Enhanced typography hierarchy -->
        <h2 class="login-title">Bem-vindo à Vamos</h2>
        <p class="login-subtitle">Insira suas credenciais para acessar o sistema</p>

        <!-- Alert messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-circle"></i>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        {% endif %}

        <!-- Login form -->
        <form method="post">
            {% csrf_token %}
            
            <!-- Username field with icon -->
            <div class="form-group">
                <i class="bi bi-person input-icon"></i>
                <input 
                    type="text" 
                    name="username" 
                    class="form-control-modern" 
                    placeholder="Usuário" 
                    required 
                    autofocus
                    autocomplete="username"
                >
            </div>

            <!-- Password field with icon -->
            <div class="form-group">
                <i class="bi bi-lock input-icon"></i>
                <input 
                    type="password" 
                    name="password" 
                    class="form-control-modern" 
                    placeholder="Senha" 
                    required
                    autocomplete="current-password"
                >
            </div>

            <!-- Full-width submit button -->
            <button type="submit" class="btn-login">
                Entrar
            </button>
        </form>

        <!-- Footer links -->
        <div class="login-footer">
            <a href="{% url 'reset_password' %}">Esqueceu a senha?</a>
            <a href="{% url 'signup' %}">Criar conta</a>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Hide sidebar and adjust wrapper for login page
        const sidebar = document.querySelector('.sidebar');
        const wrapper = document.querySelector('.wrapper');
        if(sidebar) sidebar.style.display = 'none';
        if(wrapper) {
            wrapper.style.display = 'block';
            wrapper.style.padding = '0';
            wrapper.style.margin = '0';
        }
        
        // Ensure body/html don't have unwanted overflow
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';
    });
</script>

{% endblock %}
