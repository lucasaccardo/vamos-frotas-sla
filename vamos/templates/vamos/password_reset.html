{% extends 'vamos/base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow">
        <div class="card-body">
            <h3 class="card-title text-center mb-4">Redefinir Senha</h3>
            <p class="text-muted text-center">Informe seu e-mail cadastrado e enviaremos as instruções.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_email" class="form-label">E-mail</label>
                    <input type="email" name="email" class="form-control" required id="id_email" placeholder="seu@email.com">
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Enviar E-mail de Recuperação</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
