{% extends 'vamos/base.html' %}
{% load static %}

{% block content %}
<style>
    /* Fundo igual ao do Login */
    body, html {
        height: 100%;
        background-color: #0f172a;
        font-family: 'Inter', sans-serif;
    }

    .reset-container {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=2070&auto=format&fit=crop');
        background-size: cover;
        background-position: center;
        position: relative;
    }

    /* Overlay escuro para focar no cartão */
    .reset-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
    }

    /* Cartão Central */
    .reset-card {
        position: relative;
        z-index: 10;
        background-color: #0b1120;
        border: 1px solid #1e293b;
        padding: 3rem;
        border-radius: 16px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        text-align: center;
    }

    .reset-icon {
        font-size: 3rem;
        color: #dc2626;
        margin-bottom: 1rem;
    }

    h3 { color: white; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }

    /* Input Moderno */
    .form-control-modern {
        background-color: #1e293b;
        border: 1px solid #334155;
        color: white;
        padding: 12px 15px;
        border-radius: 8px;
        width: 100%;
        margin-bottom: 1rem;
    }
    .form-control-modern:focus {
        border-color: #dc2626;
        outline: none;
        box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.2);
    }

    /* Botão */
    .btn-reset {
        background-color: #dc2626;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        width: 100%;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.9rem;
        transition: 0.2s;
    }
    .btn-reset:hover { background-color: #b91c1c; }

    .back-link {
        display: block;
        margin-top: 1.5rem;
        color: #64748b;
        text-decoration: none;
        font-size: 0.9rem;
    }
    .back-link:hover { color: white; }
</style>

<div class="reset-container">
    <div class="reset-overlay"></div>
    
    <div class="reset-card">
        <i class="bi bi-shield-lock reset-icon"></i>
        <h3>Recuperar Senha</h3>
        <p>Informe seu e-mail cadastrado e enviaremos um link seguro para você redefinir sua senha.</p>
        
        <form method="post">
            {% csrf_token %}
            <div style="text-align: left;">
                <label class="small text-muted fw-bold mb-1">E-mail Corporativo</label>
                <input type="email" name="email" class="form-control-modern" required id="id_email" placeholder="ex: lucas@vamos.com.br">
            </div>
            <button type="submit" class="btn-reset">Enviar Link de Recuperação</button>
        </form>

        <a href="{% url 'login' %}" class="back-link">
            <i class="bi bi-arrow-left me-1"></i> Voltar para o Login
        </a>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const sidebar = document.querySelector('.sidebar');
        const wrapper = document.querySelector('.wrapper');
        if(sidebar) sidebar.style.display = 'none';
        if(wrapper) { wrapper.style.display = 'block'; wrapper.style.padding = '0'; }
    });
</script>
{% endblock %}
