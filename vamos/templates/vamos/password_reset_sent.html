{% extends 'vamos/base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 600px;">
    <div class="alert alert-success shadow text-center" role="alert">
        <h4 class="alert-heading">E-mail enviado!</h4>
        <p>Acabamos de enviar instruções para redefinir sua senha para o e-mail informado (se ele estiver cadastrado no sistema).</p>
        <hr>
        <p class="mb-0">Verifique sua caixa de entrada e também a pasta de spam.</p>
    </div>
    <div class="text-center mt-3">
        <a href="{% url 'login' %}" class="btn btn-outline-secondary">Voltar para o Login</a>
    </div>
</div>
{% endblock %}
